# VALIDATION ONLY. No live models, repository or runtime images are configured.
# Aliases match deploy/config; home deliberately points to an inert endpoint here.
apiVersion: ai-flow/v1alpha1
kind: Environment
llm:
  upstreams:
    home: { baseUrl: "http://127.0.0.1:1/v1" }
metrics: { url: "http://127.0.0.1:1" }
---
apiVersion: ai-flow/v1alpha1
kind: Catalog
models:
  gpt-6.1-sol:
    upstream: home
    model: gpt-6.1-sol
    size: frontier
    context_tokens: 100000 # conservative working limit, not full capacity
    tool_use: good
    reasoning: true
    cost: subscription
    notes: Default planner alias; real gateway subscription authentication and smoke test pending.
  gpt-6-luna:
    upstream: home
    model: gpt-6-luna
    size: frontier
    context_tokens: 100000 # conservative working limit, not full capacity
    tool_use: good
    reasoning: true
    cost: subscription
    notes: Alternate alias; real gateway subscription authentication and smoke test pending.
planner:
  model: gpt-6.1-sol
  stream: true
harnesses:
  pi: { description: Replace runtime with an image containing the pi harness. }
runtimes:
  fixture-go:
    image: example.invalid/replace-me/agent-go:validation-only
grants:
  repo/template:
    kind: git
    url: https://example.invalid/replace-me/repository.git
    modes: [read, write]
---
apiVersion: ai-flow/v1alpha1
kind: Project
metadata: { name: template-project }
spec:
  repo: repo/template
  base: main
  start: manual
  allow:
    grants: ["repo/template:read", "repo/template:write"]
    models: [gpt-6.1-sol, gpt-6-luna]
  budget: { usd_per_run: 4 }
  # Merging into main deploys (CI/CD builds and rolls out main).
  deploy:
    branch: main
    url: https://example.invalid/
    versions: [{ url: "https://example.invalid/version", field: commit }]
    health:
      - { name: 5xx rate, query: 'sum(rate(http_requests_total{code=~"5.."}[5m])) or vector(0)', max: 0.05 }
