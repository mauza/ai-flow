# Environment for the local kind cluster (make dev-up). For a prod cluster,
# copy this file and change the URLs; the catalog and projects stay the same.
apiVersion: ai-flow/v1alpha1
kind: Environment
server:
  publicUrl: http://localhost:8080
  podUrl: http://ai-flow-pods.ai-flow.svc:8081
  dataDir: /data
runs:
  namespace: ai-flow-runs
  maxConcurrent: 3
  defaultTimeout: 30m
llm:
  upstreams:
    # Any OpenAI-compatible endpoint: OpenAI, OpenRouter, a LiteLLM gateway,
    # vLLM, llama.cpp or Ollama. Set LLM_BASE_URL and LLM_API_KEY in .env
    # (`make secrets` copies them into the cluster); an unset key sends no
    # Authorization header. The catalog's model names must exist there.
    home:
      baseUrl: https://api.openai.com/v1
      baseUrlEnv: LLM_BASE_URL
      apiKeyEnv: LLM_API_KEY
objectStore:
  type: garage                      # bootstrapped by the control plane
  endpoint: garage.ai-flow.svc:3900
  adminEndpoint: http://garage.ai-flow.svc:3903
  adminTokenEnv: GARAGE_ADMIN_TOKEN
  bucket: ai-flow
  region: garage
git:
  hosts:
    github.com: { tokenEnv: GITHUB_TOKEN }
  authorName: ai-flow
  authorEmail: ai-flow@users.noreply.github.com
github:
  tokenEnv: GITHUB_TOKEN
mcp:
  servers:
    # Demo server from the chart (mcpDemo.enabled). Real servers go here too,
    # with credentials as headers: { Authorization: "Bearer ${SOME_TOKEN}" }.
    demo:
      url: http://mcp-demo.ai-flow.svc:8090
      description: Demo tools (word_stats, time_now)
linear:
  enabled: false                    # true needs LINEAR_API_KEY in .env (docs/LOCAL-KIND.md)
  mode: poll
  pollInterval: 30s
# Push a message when a run needs a human (off without a backend):
# notify:
#   ntfy: { url: https://ntfy.sh, topic: my-ai-flow, tokenEnv: NTFY_TOKEN }
#   events: [gate, stuck, failed]   # default; also: succeeded
#   stuckAfter: 4h                  # remind once when a gate waits this long
