# Environment for a real cluster. Pair with the same catalog and projects as kind,
# with runtime images pointed at the registry `make release` pushed to.
apiVersion: ai-flow/v1alpha1
kind: Environment
server:
  publicUrl: http://ai-flow:8080       # tailnet name; https://... behind an ingress
  podUrl: http://ai-flow-pods.ai-flow.svc:8081
  dataDir: /data
  # authTokenEnv: AI_FLOW_TOKEN        # optional: UI/API then require this bearer token
runs:
  namespace: ai-flow-runs
  maxConcurrent: 4
  imagePullPolicy: IfNotPresent
  nodeSelector:
    kubernetes.io/arch: amd64
llm:
  upstreams:
    home:
      baseUrl: http://litellm-proxy.llm-gateway.svc:4000/v1
objectStore:
  type: local                          # <dataDir>/objects; only the control plane touches it
git:
  hosts:
    github.com: { tokenEnv: GITHUB_TOKEN }
  authorName: ai-flow
  authorEmail: ai-flow@users.noreply.github.com
github:
  tokenEnv: GITHUB_TOKEN
linear:
  enabled: true
  mode: poll                           # webhook needs a public URL: POST <publicUrl>/webhooks/linear
  pollInterval: 30s
mcp:
  servers: {}
