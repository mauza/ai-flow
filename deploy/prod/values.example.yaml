# Example values for a real cluster (e.g. an ArgoCD Application pointing at deploy/chart).
# Config files come from an existing ConfigMap you manage in git; secrets from a
# sealed/external Secret named ai-flow-secrets (GITHUB_TOKEN, LINEAR_API_KEY,
# AI_FLOW_TOKEN, upstream model keys). Images come from `make release`.
image:
  repository: registry.example.com/library/ai-flow
  tag: v0.1.0
  pullPolicy: IfNotPresent
imagePullSecrets: []                    # [{ name: regcred }] for a private registry project
config:
  existingConfigMap: ai-flow-config     # environment.yaml + catalog.yaml + projects
nodeSelector:
  kubernetes.io/arch: amd64             # images are amd64-only
persistence:
  storageClass: local-path              # SQLite: keep it off NFS
  size: 5Gi
garage:
  enabled: true                         # or false + objectStore.type: s3 in environment.yaml
  storageClass: local-path
  existingSecret: garage-secrets        # rpc-secret + admin-token; required under ArgoCD
# Either a tailnet-only Service...
service:
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: ai-flow
# ...or a public ingress (then use Linear webhook mode if you like).
ingress:
  enabled: false
  className: traefik
  host: ai-flow.example.com
  tls: [{ hosts: [ai-flow.example.com], secretName: ai-flow-tls }]
